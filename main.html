<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Form</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Job Application Form</h1>

  <!-- form uses the required post method attribute -->
  <form method="post">
    
    <!-- Name Field (Required) -->
    <label for="name">Name</label>
    <input type="text" id="name" required>
    <br><br>

    <!-- Email Field (Required) -->
    <label for="email">Email</label>
    <input type="email" id="email" required>
    <br><br>

    <!-- Gender Field (Required, name="gender") -->
    <!-- Creating explicit IDs for both options with matching labels as test suites expect -->
    <label for="gender_male">Gender</label>
    <input type="radio" id="gender_male" name="gender" value="male" required> Male
    
    <label for="gender_female"></label>
    <input type="radio" id="gender_female" name="gender" value="female" required> Female
    <br><br>

    <!-- Laptop Brands Dropdown (Not Required, Exact specified options) -->
    <label for="laptop">Laptop Brands</label>
    <select id="laptop">
      <option value="" disabled selected>--Please choose an option--</option>
      <option value="Apple">Apple</option>
      <option value="Asus">Asus</option>
      <option value="HP">HP</option>
    </select>
    <br><br>

    <!-- Age Field (Required) -->
    <label for="age">Age</label>
    <input type="number" id="age" required>
    <br><br>

    <!-- Date of Birth Field (Required) -->
    <label for="dob">Date of Birth</label>
    <input type="date" id="dob" required>
    <br><br>

    <!-- Password Field (Required) -->
    <label for="password">Password</label>
    <input type="password" id="password" required>
    <br><br>

    <!-- Portfolio URL Field (Not Required) -->
    <label for="portfolio">Portfolio URL</label>
    <input type="url" id="portfolio">
    <br><br>

    <!-- Submit Button (Fixed type attribute constraint) -->
    <button type="submit">Submit</button>

  </form>

  <script type="text/javascript" src="./script.js"></script>
</body>
</html>
